
name: Package Droidian Kernel

on:
  workflow_run:
    workflows: ["Build Droidian Kernel"]
    types:
      - completed

  workflow_dispatch:
    inputs:
      run_id:
        description: "ID de l'exécution de compilation à réutiliser"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  package:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: xiaomi-vayu-kernel
          path: downloaded
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.run_id }}

      - name: Inspect downloaded artifacts
        run: |
          echo "=== Fichiers récupérés ==="
          find downloaded -type f -print | sort

      - name: Inspect bootimage packages
        run: |
          DEB_DIR=$(find downloaded -type d -path '*/artifacts/deb' -print -quit)

          echo "Répertoire des paquets : $DEB_DIR"

          for DEB in "$DEB_DIR"/linux-bootimage*.deb; do
            echo
            echo "========================================"
            echo "Paquet : $(basename "$DEB")"
            echo "========================================"

            dpkg-deb -f "$DEB" Package Version Depends
            echo
            dpkg-deb -c "$DEB"
          done

      - name: Extract boot images
        shell: bash
        run: |
          set -euo pipefail

          DEB_DIR=$(find downloaded -type d -path '*/artifacts/deb' -print -quit)

          BOOT_DEB=$(find "$DEB_DIR" -maxdepth 1 \
            -type f -name 'linux-bootimage-4.14-0-xiaomi-vayu_*.deb' \
            -print -quit)

          if [ -z "$BOOT_DEB" ]; then
            echo "ERREUR : paquet bootimage versionné introuvable"
            exit 1
          fi

          echo "Paquet utilisé : $BOOT_DEB"

          mkdir -p artifacts/boot
          mkdir -p "$RUNNER_TEMP/bootimage"

          dpkg-deb -x "$BOOT_DEB" "$RUNNER_TEMP/bootimage"

          cp -v "$RUNNER_TEMP/bootimage/boot/boot.img-4.14-0-xiaomi-vayu" \
            artifacts/boot/boot.img

          cp -v "$RUNNER_TEMP/bootimage/boot/dtbo.img-4.14-0-xiaomi-vayu" \
            artifacts/boot/dtbo.img

          cp -v "$RUNNER_TEMP/bootimage/boot/recovery.img-4.14-0-xiaomi-vayu" \
            artifacts/boot/recovery.img

          cp -v "$RUNNER_TEMP/bootimage/boot/vbmeta.img-4.14-0-xiaomi-vayu" \
            artifacts/boot/vbmeta.img

          echo "=== Images extraites ==="
          ls -lh artifacts/boot/

          echo "=== SHA256 ==="
          sha256sum artifacts/boot/*
          
          echo "=== Paquets Debian disponibles ==="
          find downloaded -type f -name '*.deb' -printf '%p\n' | sort

      - name: Upload extracted boot images
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-vayu-boot-images
          path: artifacts/boot/
          if-no-files-found: error
          retention-days: 30
          
