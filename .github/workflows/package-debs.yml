
name: Package Droidian Debian Packages

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID de l'exécution de compilation à réutiliser"
        required: true
        type: string

      publish_release:
        description: "Publier sur GitHub Releases"
        required: true
        type: boolean
        default: false

      release_version:
        description: "Numéro de version (ex: 4.14.355-1)"
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  package:
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest

    steps:
      # Récupération de l'artifact de compilation existant
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: xiaomi-vayu-kernel
          path: downloaded
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.run_id }}

      # Extraction des paquets Debian
      - name: Collect Debian packages
        shell: bash
        run: |
          set -euo pipefail

          DEB_DIR=$(find downloaded -type d -path '*/artifacts/deb' -print -quit)

          if [ -z "$DEB_DIR" ]; then
            echo "ERREUR : répertoire artifacts/deb introuvable"
            exit 1
          fi

          mkdir -p artifacts/deb

          find "$DEB_DIR" -maxdepth 1 -type f -name '*.deb' \
            -exec cp -v {} artifacts/deb/ \;

          DEB_COUNT=$(find artifacts/deb -maxdepth 1 -type f -name '*.deb' | wc -l)

          if [ "$DEB_COUNT" -eq 0 ]; then
            echo "ERREUR : aucun paquet Debian récupéré"
            exit 1
          fi

          echo "=== Paquets Debian récupérés : $DEB_COUNT ==="
          ls -lh artifacts/deb/

          echo "=== SHA256 ==="
          (
            cd artifacts/deb
            sha256sum *.deb > SHA256SUMS
            cat SHA256SUMS
          )

      - name: Create Debian packages ZIP
        shell: bash
        run: |
          set -euo pipefail

          zip -j -9 artifacts/kernel-debs.zip \
            artifacts/deb/*.deb \
            artifacts/deb/SHA256SUMS

          echo "=== Archive des paquets Debian ==="
          ls -lh artifacts/kernel-debs.zip
          sha256sum artifacts/kernel-debs.zip

      # Publication des paquets Debian
      - name: Upload Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-vayu-debian-packages
          path: artifacts/deb/
          if-no-files-found: error
          retention-days: 30



      - name: Publish Debian packages to GitHub Release
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="v${RELEASE_VERSION}"
          REPO="$GITHUB_REPOSITORY"

          echo "=== Publication des paquets Debian : $TAG ==="

          HEAD_SHA=$(gh api \
            "repos/${REPO}/actions/runs/${RUN_ID}" \
            --jq '.head_sha')

          echo "Commit de compilation : $HEAD_SHA"

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release existante : ajout des paquets Debian"

            gh release upload "$TAG" \
              artifacts/deb/*.deb \
              artifacts/deb/SHA256SUMS \
              artifacts/kernel-debs.zip \
              --repo "$REPO" \
              --clobber
          else
            echo "Création de la Release : $TAG"

            gh release create "$TAG" \
              artifacts/deb/*.deb \
              artifacts/deb/SHA256SUMS \
              artifacts/kernel-debs.zip \
              --repo "$REPO" \
              --title "$TAG" \
              --notes "Paquets Debian du noyau Xiaomi Vayu - $TAG" \
              --target "$HEAD_SHA"
          fi

          echo "=== Publication terminée ==="

