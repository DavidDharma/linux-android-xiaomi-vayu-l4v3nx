
name: Build Droidian Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Xiaomi Vayu kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # Récupération des sources
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          
      - name: Inspect Lindroid DRM submodule
        shell: bash
        run: |
          echo "=== Git submodule status ==="
          git submodule status

          echo "=== Lindroid DRM directory ==="
          ls -la drivers/lindroid-drm/

          echo "=== Build files ==="
          find drivers/lindroid-drm -maxdepth 2 \
            \( -name Kconfig -o -name Makefile \) -print
            
      # Préparation des répertoires
      - name: Prepare build directories
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          mkdir -p artifacts/deb
          mkdir -p artifacts/boot

      # Récupération de l'environnement officiel Droidian
      - name: Pull Droidian build environment
        run: |
          docker pull quay.io/droidian/build-essential:current-amd64
          
      # Compilation et packaging
      # Compilation et packaging
      - name: Build kernel
        run: |
          set -o pipefail

          docker run --rm --init \
            -v "$GITHUB_WORKSPACE:/buildd/sources" \
            -v "$RUNNER_TEMP/packages:/buildd" \
            -w /buildd/sources \
            quay.io/droidian/build-essential:current-amd64 \
            bash -euo pipefail -c '
              apt-get update

              apt-get install -y --no-install-recommends \
                debhelper \
                linux-packaging-snippets
              
              echo "=== Version linux-packaging-snippets ==="
              dpkg -s linux-packaging-snippets | grep Version

              echo "=== Snippets disponibles ==="
              dpkg -L linux-packaging-snippets | grep -E "kernel-snippet|control-override"

              echo "KERNEL_DEVELOPER_NAME=${KERNEL_DEVELOPER_NAME:-<non défini>}"

              chmod +x debian/rules

              echo "=== debian/control ==="
              # ls -l debian/control

              echo "=== Configuration Clang dans kernel-info.mk ==="
              grep -nEi "clang|llvm|BUILD_CC|BUILD_LLVM|BUILD_CLANG" \
                debian/kernel-info.mk

              echo "=== Fichier kernel-info.mk ==="
              cat debian/kernel-info.mk

              echo "=== Deb ==="
              apt-cache policy clang-android-12.0-r416183b
              apt install clang-android-12.0-r416183b

              echo "=== Emplacement du compilateur Clang ==="
              dpkg -L clang-android-12.0-r416183b | grep -E "/bin/clang(-[0-9]+)?$"

              echo "=== Commande clang ==="
              command -v clang || true

              echo "=== Répertoires LLVM ==="
              find /usr/lib -type f \( -name clang -o -name clang-12 \)

              echo "=== Règles du kernel-snippet.mk ==="
              sed -n '1,240p' /usr/share/linux-packaging-snippets/kernel-snippet.mk

              echo "=== Présence des snippets supplémentaires ==="
              ls -l /usr/share/linux-packaging-snippets/
  
              echo "=== Règles liées à debian/control ==="
              grep -nE "control\.in|debian/control|control:" \
                /usr/share/linux-packaging-snippets/kernel-snippet.mk

              debian/rules debian/control

              echo "=== Vérification du control généré ==="
              test -s debian/control
              grep -nE "^(Source|Package|Build-Depends):" debian/control

              echo "=== Configuration des modules ==="
              # grep -E "^CONFIG_MODULES=|^# CONFIG_MODULES is not set|^CONFIG_MODULE_UNLOAD=|^CONFIG_MODVERSIONS=" out/KERNEL_OBJ/.config

              RELENG_HOST_ARCH=arm64 releng-build-package
            ' 2>&1 | tee "$RUNNER_TEMP/kernel-build.log"

      # Récupération des paquets Debian
      - name: Collect Debian packages
        run: |
          find "$RUNNER_TEMP/packages" \
            -type f -name '*.deb' \
            -exec cp -v {} artifacts/deb/ \;

          test -n "$(find artifacts/deb -name '*.deb' -print -quit)"

      # Extraction du boot.img
      # Extraction des images de démarrage
      # Extraction des images de démarrage
      - name: Extract boot images
        run: |
          set -euo pipefail

          echo "=== Recherche du paquet bootimage ==="

          if [ ! -d artifacts/deb ]; then
            echo "ERREUR : artifacts/deb introuvable"
            find artifacts -maxdepth 3 -type f -print | sort
            exit 1
          fi

          BOOT_DEB=$(find artifacts/deb \
            -type f \
            -name 'linux-bootimage-4.14-0-xiaomi-vayu_*.deb' \
            -print -quit)

          if [ -z "$BOOT_DEB" ]; then
            echo "ERREUR : paquet bootimage versionné introuvable"
            echo "=== Paquets Debian disponibles ==="
            find artifacts/deb -type f -name '*.deb' -print | sort
            exit 1
          fi

          echo "Using package : $BOOT_DEB"

          echo "=== Informations du paquet ==="
          dpkg-deb -f "$BOOT_DEB" Package Version Architecture

          echo "=== Contenu du paquet ==="
          dpkg-deb -c "$BOOT_DEB"

          mkdir -p artifacts/boot
          mkdir -p "$RUNNER_TEMP/bootimage"

          dpkg-deb -x "$BOOT_DEB" "$RUNNER_TEMP/bootimage"

          echo "=== Fichiers extraits ==="
          find "$RUNNER_TEMP/bootimage" -type f -printf '%P\n' | sort
          
          BOOT_DIR="$RUNNER_TEMP/bootimage/boot"

          if [ ! -d "$BOOT_DIR" ]; then
            echo "Boot directory not found in package!"
            echo "Package contents:"
            find "$RUNNER_TEMP/bootimage" -type f
            exit 1
          fi

          echo "=== Extraction des images ==="

          for image in boot dtbo recovery vbmeta; do
            SOURCE="$BOOT_DIR/${image}.img-4.14-0-xiaomi-vayu"

            if [ ! -f "$SOURCE" ]; then
              echo "ERREUR : image introuvable : $SOURCE"
              echo "=== Fichiers présents ==="
              find "$BOOT_DIR" -maxdepth 1 -type f -printf '%f\n'
              exit 1
            fi

            cp -v "$SOURCE" "artifacts/boot/${image}.img"
          done

          echo "=== Images extraites ==="
          ls -lh artifacts/boot/

          echo "=== SHA256 ==="
          sha256sum artifacts/boot/*



      # Informations de compilation
      - name: Generate build information
        if: always()
        run: |
          mkdir -p artifacts/config

          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Date: $(date -u)"
          } > artifacts/build-info.txt

          echo "=== Configuration finale du noyau ==="
          if [ -s out/KERNEL_OBJ/.config ]; then
            cp -v out/KERNEL_OBJ/.config artifacts/config/kernel.config
            grep -nE '^CONFIG_BACKLIGHT_CLASS_DEVICE=|^# CONFIG_BACKLIGHT_CLASS_DEVICE is not set|^CONFIG_BACKLIGHT=' \
              artifacts/config/kernel.config || true
          else
            echo "ATTENTION : out/KERNEL_OBJ/.config introuvable"
            find out -name .config -type f -print 2>/dev/null || true
          fi

          if [ -d artifacts ]; then
            find artifacts -type f -exec sha256sum {} \; \
              > artifacts/SHA256SUMS
          fi

      # Publication des résultats
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-vayu-kernel
          path: |
            artifacts/
            ${{ runner.temp }}/kernel-build.log
          if-no-files-found: warn
          retention-days: 30
